[project]
name = "segmentation-biomarkers-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "karab1n.andrei@mail.ru" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi==0.95.0",
    "matplotlib==3.7.1",
    "numpy<2",
    "opencv-python-headless==4.7.0.72",
    "pandas==2.0.0",
    "pillow==9.5.0",
    "python-multipart>=0.0.32",
    "requests==2.28.2",
    "scikit-image>=0.24.0",
    "streamlit==1.22.0",
    "torch==2.0.0",
    "torchvision==0.15.1",
    "transformers==4.28.1",
    "uvicorn==0.21.1",
]

[project.scripts]
segmentation-biomarkers-ml = "segmentation_biomarkers_ml:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
